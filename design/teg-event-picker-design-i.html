        : '<button data-act="sel" data-id="' + e.id + '" aria-pressed="false" style="min-height:46px;border-radius:10px;border:2px solid #f5a93b;background:transparent;color:#f5a93b;font-weight:800;font-size:15px">+ Pick</button>';
    const tags = e.tags.map((t) => '<span style="display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 9px 2px 6px;border-radius:999px;background:#0d2830;border:1px solid #4d8185;color:#cfe3e1">' + tagSvg(t, 13, '#f5a93b', 2.2) + esc(t) + '</span>').join('');
    return '<article style="display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:16px;background:#123540;position:relative;border:2px solid ' + (sel ? '#f5a93b' : '#2d5e66') + ';box-shadow:' + (sel ? '0 0 0 4px #f5a93b33,0 12px 30px #0008' : '0 6px 18px #0006') + '">'
      + '<div style="position:relative">' + media
      + '<div style="position:absolute;left:8px;top:8px;font-family:\'Space Mono\',monospace;font-size:12px;font-weight:700;background:#f5a93b;color:#1a1200;padding:4px 9px;border-radius:7px">' + esc(dateLabel(e.d).toUpperCase()) + '</div>'
      + (sel ? starSvg(46, 'position:absolute;right:-10px;top:-16px;filter:drop-shadow(0 3px 0 #0007)', 'star') : '')
      + '</div>'
      + '<h3 style="font-size:17px;line-height:1.15;font-weight:600">' + esc(e.title) + '</h3>'
      + '<div style="display:flex;flex-wrap:wrap;gap:5px">' + tags + '</div>'
      + action + '</article>';
  }).join('');

  const rack = picked.map((e, i) => {
    const tags = e.tags.map((t) => '<span style="display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px 2px 6px;border-radius:999px;background:#cfe2df;color:#0d2830">' + tagSvg(t, 13, '#8a4a00', 2.3) + esc(t) + '</span>').join('');
    return '<div style="position:relative;background:#eaf4f2;padding:8px 8px 10px;border-radius:4px;transform:rotate(' + ROT[i % 4] + 'deg);box-shadow:0 8px 18px #0008">'
      + '<div style="aspect-ratio:16/10;position:relative;overflow:hidden;' + artFor(e) + '"><span style="position:absolute;left:10px;bottom:-4px;font-size:60px;font-weight:800;line-height:1;color:#ffffff44">' + initialOf(e.title) + '</span></div>'
      + '<div style="display:flex;align-items:flex-start;gap:6px;margin-top:6px"><div style="flex:1;min-width:0;color:#0d2830"><div style="font-family:\'Space Mono\',monospace;font-size:12px;font-weight:700;color:#8a4a00">' + esc(dateLabel(e.d)) + '</div><div style="font-size:15px;font-weight:600;line-height:1.2">' + esc(e.title) + '</div><div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:6px">' + tags + '</div></div>'
      + '<button data-act="remove" data-id="' + e.id + '" aria-label="Remove ' + esc(e.title) + ' from your photo wall" style="flex:none;width:44px;height:44px;border-radius:8px;border:0;background:transparent;color:#0d2830;font-size:24px">×</button></div>'
      + starSvg(34, 'position:absolute;left:50%;top:-18px;margin-left:-17px;filter:drop-shadow(0 2px 0 #0006)')
      + '</div>';
  }).join('');

  const dlLabel = n === 0 ? 'Pick an event first' : n === 1 ? 'Download image' : 'Download ZIP (' + n + ' images)';
  const dateInput = (id, label, val) => '<label style="display:flex;flex-direction:column;gap:4px;font-size:13px;color:#b9d3d2">' + label + '<input type="date" data-field="' + id + '" value="' + val + '" min="2026-10-14" max="2026-11-13" style="font:inherit;font-size:16px;padding:0 10px;border-radius:10px;border:1.5px solid #6fa3a6;background:#0d2830;color:#eaf4f2;color-scheme:dark;min-height:44px"></label>';
  const badge = (t, sz) => '<span style="width:' + sz + 'px;height:' + sz + 'px;border-radius:50%;background:#f5a93b;color:#1a1200;font-weight:800;display:flex;align-items:center;justify-content:center">' + t + '</span>';

  app.innerHTML =
    '<div style="position:relative;height:230px;overflow:hidden;border-bottom:3px solid #f5a93b"><img src="' + HERO + '" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%"><div style="position:absolute;inset:0;background:linear-gradient(90deg,#0a1f26f2 0,#0a1f26cc 45%,#0a1f2640 100%)"></div><div style="position:relative;max-width:1312px;margin:0 auto;padding:0 24px;height:100%;display:flex;flex-direction:column;justify-content:center;gap:10px"><div style="font-family:\'Space Mono\',monospace;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#f5a93b">Social event picker</div><h1 style="font-size:clamp(36px,6vw,60px);line-height:1;font-weight:800;letter-spacing:-.02em">Toronto Event Generator</h1><p style="font-size:18px;color:#cfe3e1">Find starred events, pick by picture, take the images home.</p></div></div>'
    + '<div style="max-width:1312px;margin:0 auto;padding:28px 24px 60px;display:flex;flex-direction:column;gap:22px">'
    + '<section style="background:#123540;border:1.5px dashed #6fa3a6;border-radius:18px;padding:20px 24px;display:flex;flex-wrap:wrap;gap:24px 36px;align-items:center">'
    + '<div style="display:flex;flex-direction:column;gap:10px"><div style="display:flex;align-items:center;gap:10px">' + badge(1, 30) + '<h2 style="font-size:20px">When?</h2></div><div style="display:flex;flex-wrap:wrap;gap:10px">' + dateInput('from', 'From', s.from) + dateInput('to', 'To', s.to) + '</div></div>'
    + '<div style="flex:1 1 440px;display:flex;flex-direction:column;gap:10px"><div style="display:flex;align-items:center;gap:10px">' + badge(2, 30) + '<h2 style="font-size:20px">What kind? <span style="font-size:14px;font-weight:400;color:#9fbfbe">optional · pick any</span></h2></div><div style="display:flex;flex-wrap:wrap;gap:10px">' + tagBtns + '</div>' + (tagNames.length ? '' : '<div style="font-size:14px;color:#9fbfbe">No events in these dates, so no tags.</div>') + '</div></section>'
    + '<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between"><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">' + badge(3, 28) + '<h2 style="font-size:20px">Tap <em style="font-style:normal;color:#f5a93b">Pick</em> on the ones you want</h2><span style="font-family:\'Space Mono\',monospace;font-size:13px;color:#b9d3d2">' + shown.length + ' events found · ' + shown.filter(has).length + ' images loaded</span></div><div style="display:flex;gap:10px;flex-wrap:wrap"><button data-act="retry" style="font-size:14px;padding:0 16px;min-height:44px;border-radius:999px;border:1.5px solid #6fa3a6;background:transparent;color:#eaf4f2">Retry failed images</button><button data-act="reset" style="font-size:14px;padding:0 16px;min-height:44px;border-radius:999px;border:1.5px solid #6fa3a6;background:transparent;color:#eaf4f2">Start over</button></div></div>'
    + '<div style="display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start">'
    + '<div style="flex:1 1 560px;min-width:0">' + (shown.length ? '' : '<div style="padding:60px 20px;text-align:center;border:1.5px dashed #6fa3a6;border-radius:18px;font-size:20px;color:#cfe3e1">Nothing starred in these dates. Try widening the window.</div>') + '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px;padding-top:12px">' + cards + '</div></div>'
    + '<aside style="flex:0 0 330px;max-width:100%;position:sticky;top:16px;background:#08181d;border:2px solid #f5a93b;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px">'
    + '<div style="display:flex;align-items:center;gap:10px">' + badge(4, 28) + '<h2 style="font-size:20px">Your photo wall</h2></div>'
    + '<div style="font-size:28px;font-weight:800;line-height:1">' + n + ' <span style="font-size:15px;font-weight:400;color:#9fbfbe">picked</span></div>'
    + '<div style="font-size:13px;color:#b9d3d2;min-height:18px">' + (hidden ? hidden + ' hidden by your filters, still included.' : '') + '</div>'
    + '<div style="display:flex;flex-direction:column;gap:16px">' + rack + '</div>'
    + (n ? '' : '<div style="border:1.5px dashed #4d8185;border-radius:12px;padding:28px 12px;text-align:center;font-size:14px;color:#9fbfbe">Picked events get pinned here as pictures.</div>')
    + '<button data-act="download" style="min-height:52px;border-radius:14px;border:0;font-size:18px;font-weight:800;' + (n ? 'background:#f5a93b;color:#1a1200' : 'background:#2d5e66;color:#9fbfbe') + '">' + dlLabel + '</button>'
    + '<div style="font-size:13px;color:#7fe0ea;min-height:18px;line-height:1.4">' + esc(s.msg) + '</div>'
    + '<div style="font-size:12px;color:#9fbfbe;line-height:1.4">Files are named date_title.jpg and save to your Downloads folder.</div></aside>'
    + '</div></div>'
    + (z ? '<div data-act="closezoom-bg" style="position:fixed;inset:0;background:#040e11e6;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px"><div style="width:min(760px,100%);display:flex;flex-direction:column;gap:14px"><div style="aspect-ratio:4/3;border-radius:16px;position:relative;overflow:hidden;' + artFor(z) + '"><span style="position:absolute;left:30px;bottom:6px;font-size:260px;font-weight:800;line-height:1;color:#ffffff33">' + initialOf(z.title) + '</span></div><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div style="font-size:22px;font-weight:600">' + esc(z.title) + '</div><button data-act="closezoom" style="min-height:44px;padding:0 20px;border-radius:999px;border:0;background:#f5a93b;color:#1a1200;font-weight:800;font-size:16px">Close</button></div></div></div>' : '');
}

/* ---------- Events ---------- */
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act === 'closezoom-bg' && ev.target !== el) return;
  if (act === 'tag') state.tags[id] = !state.tags[id];
  else if (act === 'sel') { state.sel[id] = !state.sel[id]; state.msg = ''; }
  else if (act === 'remove') { state.sel[id] = false; state.msg = ''; }
  else if (act === 'zoom') state.zoom = id;
  else if (act === 'closezoom' || act === 'closezoom-bg') state.zoom = null;
  else if (act === 'useit') {
    const ok = /\.(jpe?g|png|webp|gif)(\?.*)?$/i.test((state.paste[id] || '').trim());
    state.fixed[id] = ok; state.err[id] = !ok;
  }
  else if (act === 'retry') state.msg = 'Trying again for cards with no image…';
  else if (act === 'reset') { state.sel = {}; state.tags = {}; state.paste = {}; state.fixed = {}; state.err = {}; state.msg = 'Cleared. Fresh start.'; }
  else if (act === 'download') {
    const files = EVENTS.filter((e) => state.sel[e.id] && (e.img || state.fixed[e.id])).map((e) => e.d + '_' + slug(e.title) + '.jpg');
    state.msg = !files.length ? 'Pick at least one event first.' : files.length === 1 ? 'Demo: this would save ' + files[0] : 'Demo: this would save a ZIP of ' + files.length + ' images.';
  }
  render();
});
document.addEventListener('input', (ev) => {
  if (ev.target.dataset.field === 'paste') state.paste[ev.target.dataset.id] = ev.target.value;
});
document.addEventListener('change', (ev) => {
  const f = ev.target.dataset.field;
  if (f === 'from') { state.from = ev.target.value || '2026-10-14'; render(); }
  if (f === 'to') { state.to = ev.target.value || '2026-10-28'; render(); }
});
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && state.zoom) { state.zoom = null; render(); } });

render();
</script>
</body>
</html>
